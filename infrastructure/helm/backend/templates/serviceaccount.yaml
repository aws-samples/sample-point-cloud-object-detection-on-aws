apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
# Pods that name this account get no Kubernetes API token unless they ask for one. The
# charts' pods also set this themselves; IRSA's projected token does not depend on it.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workerServiceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.workerServiceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false

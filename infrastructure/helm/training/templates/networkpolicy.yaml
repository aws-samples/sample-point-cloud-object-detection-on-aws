{{- include "pcd.validateNetworkPolicy" . }}
{{- if .Values.networkPolicy.enabled }}
# The trainer runs third-party model code over annotated data with its IRSA role in
# reach, and serves nothing. So no ingress, and egress only to cluster DNS and HTTPS
# outside the VPC and the link-local range: S3, STS and, when
# training.allowNoncommercialWeights opts in, the pretrained checkpoint host, but not the cluster API, the api pods or instance metadata (T49).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: training-isolation
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: training
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.networkPolicy.vpcCidr }}
              - 169.254.0.0/16
      ports:
        - port: 443
          protocol: TCP
{{- end }}

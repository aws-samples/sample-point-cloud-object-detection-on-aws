# nginx's server block, mounted over the image's /etc/nginx/conf.d/default.conf. It is
# templated here, not baked into the image, because it differs by access mode and the
# root filesystem is read-only. frontend/nginx.conf is the local docker-compose copy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen {{ .Values.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    {{- if eq .Values.accessMode "port-forward" }}

        # No ALB in this mode, so the browser's same-origin /api calls come here and
        # nginx forwards them to the api Service. Resolved per request through
        # cluster DNS rather than once at startup, so nginx starts before the backend
        # exists and follows a re-created Service.
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;
        location /api/ {
            # The rule the ALB applies in public mode, for the same reason: another
            # site open in the browser can reach localhost too. It cannot add this
            # header without a preflight, and the preflight lacks it.
            if ($http_{{ include "pcd.clientHeaderName" . | lower | replace "-" "_" }} != "{{ include "pcd.clientHeaderValue" . }}") {
                return 403;
            }
            # DNS rebinding: a page whose own name resolves to 127.0.0.1 is
            # same-origin with itself and can add the header, but its Host is still
            # that name. Only the tunnel's own names are served. This check is the
            # allowlist the request-host rule asks for, so its finding is reviewed:
            # nosemgrep: request-host-used, generic.nginx.security.request-host-used, generic.nginx.security.request-host-used.request-host-used
            if ($host !~ ^(localhost|127\.0\.0\.1)$) {
                return 421;
            }
            set $api_upstream http://{{ .Values.portForward.apiService }}.{{ .Values.namespace }}.svc.cluster.local:80;
            proxy_pass $api_upstream;
            # JSON only: file data goes straight to S3 on presigned URLs. The largest
            # body is an upload's part list or an annotation set.
            client_max_body_size 10m;
        }

        # The SPA's Sign out link. There is no session here to end: access lasts as
        # long as the tunnel does.
        location = /signout {
            default_type text/plain;
            return 200 "Nothing to sign out of. This deployment is reached through kubectl port-forward; stop the port-forward to end access.\n";
        }
    {{- else }}

        # Every request carries the ALB's session cookie, which the ELB guide allows up
        # to 16K in four shards, all on one Cookie line. nginx's default of 8k per header
        # line would answer 400 to every page load once it grows past that, for example
        # with more scopes or a federated identity provider.
        large_client_header_buffers 4 32k;

        # Sign out, in this browser. The ALB's session cookie may be HttpOnly, so it is
        # expired here, server-side, for each of its up to four shards; then Cognito
        # ends its hosted-page session and returns to /, which starts a fresh sign-in.
        # No token is revoked: admin-user-global-sign-out does that.
        location = /signout {
            {{- range $n := until 4 }}
            add_header Set-Cookie "{{ $.Values.ingress.auth.sessionCookie }}-{{ $n }}=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Secure" always;
            {{- end }}
            add_header Cache-Control "no-store" always;
            # This location's add_header replaces the server-level headers below.
            {{- include "pcd.securityHeaders" . | nindent 12 }}
            return 302 "{{ include "pcd.cognitoLogoutUrl" . }}";
        }
    {{- end }}

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # add_header here replaces the server-level headers below rather than adding
            # to them, so they are repeated for static assets.
            {{- include "pcd.securityHeaders" . | nindent 12 }}
        }

        # Security headers, CSP (T35) and, in public mode, HSTS (T57). Every location
        # above with an add_header of its own repeats them.
        {{- include "pcd.securityHeaders" . | nindent 8 }}
    }

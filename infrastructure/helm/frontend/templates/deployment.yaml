apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
  annotations:
    # checkov:skip=CKV_K8S_15 in annotation form. IfNotPresent is deliberate: the tag
    # is required, never latest, and names one immutable build (T29), so a node that
    # has it holds the same bytes a pull would fetch.
    checkov.io/skip1: CKV_K8S_15=Immutable tag required by the chart; IfNotPresent is safe
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # Roll the pods when the nginx config changes; a subPath mount never picks up
        # a ConfigMap edit on its own.
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # nginx never calls the Kubernetes API, so no token is mounted for a foothold to
      # use.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "pcd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          ports:
            - containerPort: {{ .Values.port }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.port }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.port }}
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: frontend-nginx
      nodeSelector:
        workload-type: cpu

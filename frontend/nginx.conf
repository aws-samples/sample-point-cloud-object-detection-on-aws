server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy. On EKS this file is replaced by the chart's (helm/frontend
    # configmap-nginx.yaml). Uncomment for local Docker development:
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    # }

    # The SPA's Sign out link. Local docker-compose has no sign-in, so there is no
    # session to end; on EKS the chart's server block replaces this one.
    location = /signout {
        default_type text/plain;
        return 200 "Nothing to sign out of: this local deployment has no sign-in.\n";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header here replaces the server-level headers below rather than adding
        # to them, so they are repeated for static assets.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' http://localhost:4566; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Security headers, and the chart's Content-Security-Policy (T35) with the local S3,
    # on the port compose publishes, in place of the input bucket. No HSTS: this is
    # plain HTTP on localhost.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' http://localhost:4566; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
